[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacore-cli"
version = "0.4.1"
description = "DataCore platform CLI and installable Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "DP Technology" }]
keywords = ["datacore", "laboratory", "conductivity", "cli", "agent", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
datacore = "datacore_cli.main:main"

[project.urls]
Documentation = "https://datacore-cli.dp.cd.mba"
Repository = "https://github.com/dptech-yb/datacore-cli"
Issues = "https://github.com/dptech-yb/datacore-cli/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["datacore_cli*"]

[tool.setuptools.package-data]
datacore_cli = [
  "skills/*/SKILL.md",
  "skills/*/references/*.md",
  "skills/*/agents/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
