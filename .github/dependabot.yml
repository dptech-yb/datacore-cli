version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Init and analyze share versioned configuration and must move together.
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
