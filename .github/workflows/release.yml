name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package version
        run: |
          package_version="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          test "v$package_version" = "${GITHUB_REF_NAME}"
      - name: Test and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine cyclonedx-bom sigstore pip-audit
          ruff check .
          ruff format --check .
          pytest -q
          python -m pip_audit
          python -m build
          python -m twine check dist/*
      - name: Create SBOM and checksums
        run: |
          cp install.sh install.ps1 dist/
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          cyclonedx-py environment .sbom-venv/bin/python \
            --pyproject pyproject.toml \
            --output-reproducible \
            --output-format JSON \
            --output-file "dist/datacore-cli-${GITHUB_REF_NAME#v}.cdx.json"
          (cd dist && sha256sum -- ./* | sed 's#  \./#  #' > SHA256SUMS)
      - name: Sign checksum manifest with Sigstore OIDC
        run: python -m sigstore sign --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "DataCore CLI $GITHUB_REF_NAME"

  publish-pypi:
    needs: build-release
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Keep only Python distribution files
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
