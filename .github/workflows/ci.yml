name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: datacore --version
      - run: datacore skills list

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: sh -n install.sh
      - name: Test one-command installer against local release assets
        run: |
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum -- ./* | sed 's#  \./#  #' > SHA256SUMS)
          python -m http.server 8765 --directory dist >/tmp/datacore-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          test_home="$(mktemp -d)"
          HOME="$test_home" DATACORE_INSTALL_ROOT="$test_home/app" DATACORE_BIN_DIR="$test_home/bin" \
            DATACORE_RELEASE_BASE="http://127.0.0.1:8765" \
            sh install.sh --version v0.1.0 --no-setup
          "$test_home/bin/datacore" --version
          "$test_home/bin/datacore" skills list

  unix-installer:
    name: Installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build local release assets
        run: |
          python -m pip install build
          python -m build
          cp install.sh install.ps1 dist/
          (cd dist && shasum -a 256 ./* | sed 's#  \./#  #' > SHA256SUMS)
      - name: Install from local release
        run: |
          python -m http.server 8765 --directory dist >/tmp/datacore-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          test_home="$(mktemp -d)"
          HOME="$test_home" DATACORE_INSTALL_ROOT="$test_home/app" DATACORE_BIN_DIR="$test_home/bin" \
            DATACORE_RELEASE_BASE="http://127.0.0.1:8765" \
            sh install.sh --version v0.1.0 --no-setup
          "$test_home/bin/datacore" --version
          "$test_home/bin/datacore" skills list

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Install from local release
        shell: pwsh
        run: |
          python -m pip install build
          python -m build
          Copy-Item install.sh, install.ps1 dist/
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", "dist" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            $testRoot = Join-Path $env:RUNNER_TEMP "datacore-installer"
            $env:DATACORE_INSTALL_ROOT = Join-Path $testRoot "app"
            $env:DATACORE_RELEASE_BASE = "http://127.0.0.1:8765"
            & ./install.ps1 -Version v0.1.0 -NoSetup
            & (Join-Path $env:DATACORE_INSTALL_ROOT "venv\Scripts\datacore.exe") --version
            & (Join-Path $env:DATACORE_INSTALL_ROOT "venv\Scripts\datacore.exe") skills list
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
