name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: datacore --version
      - run: datacore skills list

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: sh -n install.sh uninstall.sh
      - name: Test one-command installer against local release assets
        run: |
          cp install.sh install.ps1 uninstall.sh uninstall.ps1 dist/
          (cd dist && sha256sum -- ./* | sed 's#  \./#  #' > SHA256SUMS)
          python -m http.server 8765 --directory dist >/tmp/datacore-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          test_home="$(mktemp -d)"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          HOME="$test_home" DATACORE_INSTALL_ROOT="$test_home/app" DATACORE_BIN_DIR="$test_home/bin" \
            DATACORE_RELEASE_BASE="http://127.0.0.1:8765" \
            sh install.sh --version "v$package_version" --no-setup
          "$test_home/bin/datacore" --version
          "$test_home/bin/datacore" skills list
          HOME="$test_home" DATACORE_INSTALL_ROOT="$test_home/app" DATACORE_BIN_DIR="$test_home/bin" \
            sh "$test_home/app/uninstall.sh" --purge-backups
          test ! -e "$test_home/app"
          test ! -e "$test_home/bin/datacore"
          test ! -e "$test_home/.agents/datacore-skill-install.json"

  unix-installer:
    name: Installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build local release assets
        run: |
          python -m pip install build
          python -m build
          cp install.sh install.ps1 uninstall.sh uninstall.ps1 dist/
          (cd dist && shasum -a 256 ./* | sed 's#  \./#  #' > SHA256SUMS)
      - name: Install from local release
        run: |
          python -m http.server 8765 --directory dist >/tmp/datacore-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          test_home="$(mktemp -d)"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          HOME="$test_home" DATACORE_INSTALL_ROOT="$test_home/app" DATACORE_BIN_DIR="$test_home/bin" \
            DATACORE_RELEASE_BASE="http://127.0.0.1:8765" \
            sh install.sh --version "v$package_version" --no-setup
          "$test_home/bin/datacore" --version
          "$test_home/bin/datacore" skills list
          HOME="$test_home" DATACORE_INSTALL_ROOT="$test_home/app" DATACORE_BIN_DIR="$test_home/bin" \
            sh "$test_home/app/uninstall.sh" --purge-backups
          test ! -e "$test_home/app"
          test ! -e "$test_home/bin/datacore"
          test ! -e "$test_home/.agents/datacore-skill-install.json"

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($script in @("install.ps1", "uninstall.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$script", [ref]$null, [ref]$errors) | Out-Null
            $allErrors += $errors
          }
          if ($allErrors.Count -gt 0) { $allErrors | Format-List; exit 1 }
      - name: Install from local release
        shell: pwsh
        run: |
          python -m pip install build
          python -m build
          Copy-Item install.sh, install.ps1, uninstall.sh, uninstall.ps1 dist/
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", "dist" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            $testRoot = Join-Path $env:RUNNER_TEMP "datacore-installer"
            $env:DATACORE_INSTALL_ROOT = Join-Path $testRoot "app"
            $env:DATACORE_RELEASE_BASE = "http://127.0.0.1:8765"
            $packageVersion = (python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])').Trim()
            & ./install.ps1 -Version "v$packageVersion" -NoSetup
            & (Join-Path $env:DATACORE_INSTALL_ROOT "venv\Scripts\datacore.exe") --version
            & (Join-Path $env:DATACORE_INSTALL_ROOT "venv\Scripts\datacore.exe") skills list
            if (-not (Test-Path (Join-Path $env:DATACORE_INSTALL_ROOT "uninstall.ps1"))) { throw "Installed uninstaller is missing." }
            & ./uninstall.ps1 -PurgeBackups
            if (Test-Path $env:DATACORE_INSTALL_ROOT) { throw "Uninstall left the install root behind." }
            if (Test-Path (Join-Path $HOME ".agents\datacore-skill-install.json")) { throw "Uninstall left the Skills manifest behind." }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Ensure generated documentation is committed
        run: git diff --exit-code -- site/public site/src/content/docs/reference/commands.md
